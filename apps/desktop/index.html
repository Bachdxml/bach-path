<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathology Viewer</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="node_modules/openseadragon/build/openseadragon/openseadragon.min.js"></script>
  </head>
  <body>
    <div class="app">
      <nav class="tab-bar">
        <button class="tab-btn active" data-tab="import">Import</button>
        <button class="tab-btn" data-tab="gallery">Gallery</button>
        <button class="tab-btn" data-tab="viewer">Viewer</button>
        <button class="tab-btn settings-btn" data-tab="settings" title="Settings">⚙</button>
      </nav>

      <main class="tab-content">
        <section id="tab-import" class="tab-pane active">
          <div class="drop-zone" id="drop-zone">
            <p class="drop-zone-text">Drag WSI files here or click to select</p>
            <p class="drop-zone-hint">Supports .svs, .tif, .tiff</p>
          </div>
          <div class="import-actions">
            <button class="btn btn-primary" id="btn-select-folder">Select folder (recursive)</button>
          </div>
          <div class="import-status" id="import-status"></div>
          <div class="import-progress" id="import-progress"></div>
        </section>

        <section id="tab-gallery" class="tab-pane">
          <div class="gallery-grid" id="gallery-grid"></div>
          <div class="gallery-empty" id="gallery-empty">
            No slides yet. Import slides from the Import tab.
          </div>
        </section>

        <section id="tab-viewer" class="tab-pane">
          <div class="viewer-toolbar">
            <button class="btn btn-secondary" id="viewer-back">Back to Gallery</button>
          </div>
          <div class="viewer-container" id="viewer-container"></div>
          <div class="viewer-empty" id="viewer-empty">
            Select a slide from the Gallery to view.
          </div>
        </section>

        <section id="tab-settings" class="tab-pane">
          <div class="settings-form">
            <h2>Settings</h2>
            <div class="form-group">
              <label for="api-port">API Port</label>
              <input type="number" id="api-port" min="1024" max="65535" value="8765" />
            </div>
            <p class="settings-hint">Changes take effect on next app restart.</p>
            <button class="btn btn-primary" id="btn-save-settings">Save</button>
          </div>
        </section>
      </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/import.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/viewer.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>

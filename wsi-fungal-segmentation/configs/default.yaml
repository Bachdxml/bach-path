# -----------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------
data:
  export_root: "C:/Users/bachd/Desktop/QupathMLV2/exports_ml"  # update this
  img_size: 512          # must be divisible by 16
  val_ratio: 0.2
  random_seed: 42

# -----------------------------------------------------------------------
# DataLoader
# -----------------------------------------------------------------------
loader:
  batch_size: 4
  num_workers: 0

# -----------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------
model:
  in_ch: 3
  out_ch: 1

# -----------------------------------------------------------------------
# Loss
# -----------------------------------------------------------------------
loss:
  alpha: 0.7   # FN penalty weight (higher = better recall)
  beta: 0.3    # FP penalty weight
  gamma: 0.75  # focal exponent

# -----------------------------------------------------------------------
# Optimizer
# -----------------------------------------------------------------------
optimizer:
  lr: 0.0001
  weight_decay: 0.0001

# -----------------------------------------------------------------------
# Scheduler (ReduceLROnPlateau)
# -----------------------------------------------------------------------
scheduler:
  factor: 0.5
  patience: 5
  min_lr: 0.0000001

# -----------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------
training:
  epochs: 50
  early_stop_patience: 15
  clip_grad: 1.0
  checkpoint_path: "checkpoints/best_model.pth"

# -----------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------
data:
  export_root: ""  # Set via --export-root or API (e.g. MASTERTILE folder)
  img_size: 512
  val_ratio: 0.2
  random_seed: 42
  flat_format: false  # MASTERTILE format: <slide>/<density>/images, <slide>/<density>/masks

# -----------------------------------------------------------------------
# DataLoader
# -----------------------------------------------------------------------
loader:
  batch_size: 4
  num_workers: 0

# -----------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------
model:
  in_ch: 3
  out_ch: 1
  num_density_classes: 4
  dropout_p: 0.3

# -----------------------------------------------------------------------
# Loss
# -----------------------------------------------------------------------
loss:
  smooth: 0.000001
  density_weight: 0.3
  aux3_weight: 0.2
  aux2_weight: 0.1

# -----------------------------------------------------------------------
# Optimizer
# -----------------------------------------------------------------------
optimizer:
  lr: 0.0001
  weight_decay: 0.0001

# -----------------------------------------------------------------------
# Scheduler
# -----------------------------------------------------------------------
scheduler:
  factor: 0.5
  patience: 5
  min_lr: 0.0000001

# -----------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------
training:
  epochs: 50
  early_stop_patience: 15
  clip_grad: 1.0
  checkpoint_path: "checkpoints/best_model.pth"

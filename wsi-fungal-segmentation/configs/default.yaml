# -----------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------
data:
  export_root: "../training_data/MASTERTILE"  # Default repo dropzone for training tiles
  img_size: 512
  val_ratio: 0.2
  random_seed: 42
  flat_format: false  # MASTERTILE format: <slide>/<density>/images, <slide>/<density>/masks

# -----------------------------------------------------------------------
# DataLoader
# -----------------------------------------------------------------------
loader:
  batch_size: 4
  num_workers: 0
  auto_num_workers: true
  prefetch_factor: 2

# -----------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------
model:
  in_ch: 3
  out_ch: 1
  num_density_classes: 4
  dropout_p: 0.3

# -----------------------------------------------------------------------
# Loss
# -----------------------------------------------------------------------
loss:
  density_params:
    low: [0.5, 0.5]
    medium: [0.6, 0.4]
    high: [0.7, 0.3]
    negative: [0.5, 0.5]
  smooth: 0.000001
  density_weight: 0.3
  aux3_weight: 0.3
  aux2_weight: 0.1

# -----------------------------------------------------------------------
# Optimizer
# -----------------------------------------------------------------------
optimizer:
  lr: 0.0001
  weight_decay: 0.0001

# -----------------------------------------------------------------------
# Scheduler
# -----------------------------------------------------------------------
scheduler:
  factor: 0.5
  patience: 5
  min_lr: 0.0000001
  mode: "max"

# -----------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------
training:
  epochs: 50
  early_stop_patience: 15
  clip_grad: 1.0
  checkpoint_path: "checkpoints/best_model.pth"
  amp: true
  amp_dtype: "auto" # auto | float16 | bfloat16
  channels_last: true
  tf32: true
  compile: false

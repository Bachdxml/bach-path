# -----------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------
data:
  export_root: "C:/Users/bachd/Desktop/QupathMLV2/exports_ml"  # update this
  img_size: 512          # must be divisible by 16
  val_ratio: 0.2
  random_seed: 42

# -----------------------------------------------------------------------
# DataLoader
# -----------------------------------------------------------------------
loader:
  batch_size: 4
  num_workers: 0

# -----------------------------------------------------------------------
# Model
# -----------------------------------------------------------------------
model:
  in_ch: 3
  out_ch: 1
  num_density_classes: 4
  dropout_p: 0.3

# -----------------------------------------------------------------------
# Loss
# -----------------------------------------------------------------------
loss:
  # AsymmetricSimilarityLoss — per-density α/β pairs
  # α weights FN (higher = more sensitive / fewer missed positives)
  # β weights FP (higher = more conservative / fewer false alarms)
  density_params:
    low:      [0.5, 0.5]   # balanced
    medium:   [0.6, 0.4]   # mild recall bias
    high:     [0.7, 0.3]   # recall-biased, penalise FN heavily
    negative: [0.5, 0.5]   # balanced (all-background tiles)

  # CombinedLoss
  density_weight: 0.3      # weight on density classification head loss
  aux3_weight: 0.3         # weight on decoder-3 auxiliary seg loss
  aux2_weight: 0.1         # weight on decoder-2 auxiliary seg loss

# -----------------------------------------------------------------------
# Optimizer
# -----------------------------------------------------------------------
optimizer:
  lr: 0.0001
  weight_decay: 0.0001

# -----------------------------------------------------------------------
# Scheduler (ReduceLROnPlateau)
# -----------------------------------------------------------------------
scheduler:
  factor: 0.5
  patience: 5
  min_lr: 0.0000001
  mode: "max"              # monitoring val_dice (higher = better)

# -----------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------
training:
  epochs: 50
  early_stop_patience: 15
  clip_grad: 1.0
  checkpoint_path: "checkpoints/best_model.pth"
